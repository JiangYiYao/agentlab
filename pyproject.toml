[project]
name = "agentlab"
version = "0.1.0"
description = "Local-first experiment and promotion gates for agent artifacts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AgentLab contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentlab = "agentlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["skills/agentlab/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/agentlab/scripts", "."]
